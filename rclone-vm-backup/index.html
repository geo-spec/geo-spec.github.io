<h1>rclone-vm-backup</h1>
<p>A personal, single-user backup utility. It uploads encrypted backups of the owner's own server to the owner's own Google Drive using <a href="https://rclone.org/">rclone</a>.</p>
<p>It is not a public service: there are no other users, no sign-up and no website features beyond this page.</p>
